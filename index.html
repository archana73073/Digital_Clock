<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Digital Clock</h1>
    <div class="clock">
        <div class="circle" id="hours">
              <div class="value" id="hh">00</div>
              <span>HOURS</span>
        </div>
        <div class="circle" id="minutes">
             <div class="value" id="mm">00</div>
             <span>MINUTES</span>
        </div>
        <div class="circle" id="seconds">
              <div class="value" id="ss">00</div>
              <span>SECONDS</span>
        </div>
        <footer>
            <p>
          <a href="https://www.linkedin.com/in/archana-verma-av123/" target="_blank"> @Archana Verma</a>
        </p>
        </footer>

    
    </div>
    <script src="app.js"></script>
</body>
</html>
